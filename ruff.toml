# Pin the lint rule set explicitly. CI installs the latest ruff, and ruff 0.16
# expanded its default rules (C4, BLE, DTZ, I, ISC, EXE), which failed CI with no
# code change. E4/E7/E9/F are ruff's pre-0.16 defaults; I (import sorting) is
# opted into explicitly. Add other rule families here deliberately.
[lint]
select = ["E4", "E7", "E9", "F", "I"]
