name: 'options_dbt'
version: '1.0.0'

profile: 'options_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Seed that stg_fidelity_transactions reads. The full export
  # (seeds/fidelity_transactions.csv) is gitignored, so the public default is
  # the committed sample. Override: --vars '{transactions_seed: fidelity_transactions}'
  transactions_seed: sample_fidelity_transactions

models:
  options_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  options_dbt:
    fidelity_transactions:
      +column_types:
        run_date: date
        settlement_date: date
        price: double
        quantity: double
        commission: double
        fees: double
        amount: double
    sample_fidelity_transactions:
      +column_types:
        run_date: date
        settlement_date: date
        price: double
        quantity: double
        commission: double
        fees: double
        amount: double
